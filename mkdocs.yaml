site_name: Portfólio Técnico - Charles Paiva
site_url: https://charlespaivadeveloper.github.io/portfolio-tecnico/
use_directory_urls: true
docs_dir: docs
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
nav:
  - Início: index.md
  - Projetos:
      - Enterprise RAG Java: projetos/enterprise-rag-java.md
      - Spring AI MCP Clean: projetos/spring-ai-mcp-clean.md
      - Nomad Tax Calculation Engine: projetos/nomad-tax-calculation-engine.md
  - Arquitetura:
      - Decisões e Diagramas: arquitetura/index.md
  - System Design Problems:
      - Design a scheduled digital transaction system: system-design-problems/design-a-scheduled-digital-transaction-system.md
      - Design a Digital Wallet: system-design-problems/design-a-digital-wallet.md

markdown_extensions:
  - meta
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.magiclink
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - admonition
  - toc:
      permalink: true
  - md_in_html

plugins:
  - search
  - mermaid2
